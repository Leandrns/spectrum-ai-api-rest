services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-spectrum}
      POSTGRES_USER: ${DATABASE_USER:-spectrum}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-spectrum}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DATABASE_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-spectrum} -d ${DATABASE_NAME:-spectrum}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-spectrum}
      DATABASE_USER: ${DATABASE_USER:-spectrum}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-spectrum}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Default inline pelo mesmo motivo do CORS abaixo: `${VAR:-}` passaria a
      # variavel vazia e anularia o default do application.properties.
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      FIPE_API_TOKEN: ${FIPE_API_TOKEN:-}
      FIPE_API_BASE_URL: ${FIPE_API_BASE_URL:-https://fipe.parallelum.com.br/api/v2}
      FIPE_VEHICLE_TYPE: ${FIPE_VEHICLE_TYPE:-cars}
      FIPE_FILTER_SEGMENTS: ${FIPE_FILTER_SEGMENTS:-true}
      FIPE_MIN_YEAR: ${FIPE_MIN_YEAR:-2022}
      # ATENCAO ao editar: `${VAR:-}` passa a variavel VAZIA para o container, e o
      # default do Spring (`${VAR:origens}`) so vale quando a variavel NAO existe.
      # Deixar vazio aqui zera a lista de origens e derruba todo CORS com 403.
      # Por isso o default de dev vai inline — mantenha em sincronia com
      # application-dev.properties.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*,http://192.168.*.*:*,http://172.16.*.*:*,http://10.*.*.*:*,exp://*}
      # Exportacao CSV/PDF. Sem bucket configurado a API sobe normalmente e apenas
      # os endpoints /export respondem 502. Para habilitar, copie
      # docker-compose.override.yml.example para docker-compose.override.yml —
      # o Compose o aplica sozinho e ele monta o JSON da service account.
      GCS_EXPORT_BUCKET: ${GCS_EXPORT_BUCKET:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      EXPORT_URL_TTL_MINUTES: ${EXPORT_URL_TTL_MINUTES:-60}
      # Alternativa ao arquivo de credencial montado, para reproduzir localmente o
      # mesmo caminho usado em Railway/Heroku. Vazio = usa o arquivo do override.
      GCP_CREDENTIALS_JSON: ${GCP_CREDENTIALS_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
