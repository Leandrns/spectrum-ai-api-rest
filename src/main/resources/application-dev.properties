spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.spectrumai=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# =============================================================
# DEFAULTS LOCAIS DE DEV - NUNCA USE EM PRODUCAO
# Estes valores so se aplicam quando o profile 'dev' esta ativo.
# Em prod o profile 'prod' e ativado e estas linhas nao tem efeito;
# a env var JWT_SECRET e obrigatoria la.
# =============================================================

# JWT: chave HS256 de 64 bytes (>= 256 bits exigidos pelo jjwt)
spectrum.security.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-please-override-with-env-var-in-production-environments-9f8a7b6c5d4e3f2a}

# Em dev libera CORS para Expo local e web.
# Usa padroes com curinga porque nao da para enumerar as origens: o Expo escolhe a
# porta dinamicamente e o celular na mesma rede acessa a API pelo IP da maquina
# (ex.: http://192.168.0.7:8081), que muda a cada rede.
#   localhost/127.0.0.1 -> Expo Web e navegador na propria maquina
#   10.0.2.2            -> emulador Android (alias do host)
#   192.168/172.16/10.x -> celular fisico na rede local (faixas privadas RFC 1918)
spectrum.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*,http://192.168.*.*:*,http://172.16.*.*:*,http://10.*.*.*:*,exp://*}

# Em dev o rate limit pode atrapalhar testes manuais - aumenta o teto
spectrum.security.rate-limit.default-per-minute=${RATE_LIMIT_DEFAULT:600}
spectrum.security.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH:60}

# Isola os exports de desenvolvimento dos de producao dentro do mesmo bucket
spectrum.storage.gcs.object-prefix=${GCS_OBJECT_PREFIX:exports-dev}
