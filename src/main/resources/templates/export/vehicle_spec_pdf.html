<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Ficha Técnica - Spectrum AI</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 10mm 12mm 14mm 12mm;
            @bottom-left {
                content: "Spectrum AI • Inteligência Competitiva Automotiva";
                font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
                font-size: 7.5pt;
                color: #64748b;
            }
            @bottom-right {
                content: "Página " counter(page) " de " counter(pages);
                font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
                font-size: 7.5pt;
                font-weight: bold;
                color: #0f172a;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            color: #1e293b;
            background-color: #ffffff;
            font-size: 8.5pt;
            line-height: 1.3;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        /* Container Principal do Veículo */
        .vehicle-sheet {
            page-break-after: always;
        }
        .vehicle-sheet:last-child {
            page-break-after: auto;
        }

        /* Header Corporativo (Estilo Ford) */
        .header-table {
            width: 100%;
            background: linear-gradient(135deg, #0b2046 0%, #1e3a8a 100%);
            background-color: #0b2046;
            color: #ffffff;
            border-collapse: collapse;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .header-table td {
            padding: 10px 14px;
            vertical-align: middle;
        }

        .header-title h1 {
            font-size: 15pt;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .header-title .subtitle {
            font-size: 9pt;
            color: #93c5fd;
            font-weight: 500;
        }

        .header-meta {
            text-align: right;
            font-size: 8pt;
            color: #cbd5e1;
            width: 180px;
        }

        /* Quick Specs Banner (Cards Superiores) */
        .quick-specs-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 4px 0;
            margin-bottom: 10px;
        }

        .quick-spec-card {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-top: 3px solid #0066cc;
            padding: 5px 6px;
            text-align: center;
            vertical-align: middle;
            border-radius: 3px;
        }

        .quick-spec-label {
            font-size: 6.5pt;
            text-transform: uppercase;
            color: #64748b;
            font-weight: bold;
            letter-spacing: 0.4px;
            margin-bottom: 2px;
        }

        .quick-spec-value {
            font-size: 9pt;
            font-weight: 800;
            color: #0b2046;
        }

        /* Grid de Duas Colunas para Categorias */
        .categories-grid {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .category-col {
            display: table-cell;
            width: 50%;
            vertical-align: top;
        }

        .category-col:first-child {
            padding-right: 4px;
        }

        .category-col:last-child {
            padding-left: 4px;
        }

        /* Bloco de Categoria e Tabela */
        .category-block {
            margin-bottom: 8px;
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .category-header {
            background-color: #0b2046;
            color: #ffffff;
            font-size: 8pt;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 4px 8px;
            border-left: 4px solid #0066cc;
            border-radius: 2px 2px 0 0;
        }

        .spec-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #cbd5e1;
            border-top: none;
        }

        .spec-table tr {
            border-bottom: 1px solid #e2e8f0;
        }

        .spec-table tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .spec-table td {
            padding: 3.5px 8px;
            vertical-align: middle;
        }

        .spec-label {
            width: 50%;
            font-weight: 500;
            color: #334155;
            font-size: 7.5pt;
        }

        .spec-value {
            width: 34%;
            font-weight: 700;
            color: #0f172a;
            font-size: 7.5pt;
        }

        .spec-source {
            width: 18%;
            text-align: right;
        }

        /* Sem uppercase e sem quebra: "Não encontrado" é o rótulo mais longo e,
           se quebrar em duas linhas, deixa só as linhas de dado ausente mais
           altas que as demais — some o alinhamento da tabela. O nowrap faz a
           coluna reservar a largura do maior rótulo, uma vez, para todas. */
        .badge-source {
            font-size: 5.5pt;
            font-weight: 700;
            padding: 1.5px 3.5px;
            border-radius: 2px;
            display: inline-block;
            white-space: nowrap;
        }

        .source-official {
            background-color: #e0f2fe;
            color: #0369a1;
            border: 1px solid #bae6fd;
        }

        .source-review {
            background-color: #fef3c7;
            color: #b45309;
            border: 1px solid #fde68a;
        }

        /* Estimado é dado inferido — sinaliza cautela. */
        .source-estimated {
            background-color: #ffe4e6;
            color: #be123c;
            border: 1px solid #fecdd3;
            font-style: italic;
        }

        /* Não encontrado é ausência de dado, não confiança baixa: fica neutro,
           fora da escala de cores, para não competir com o que foi encontrado. */
        .source-not-found {
            background-color: #f1f5f9;
            color: #64748b;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <div th:each="vehicleData : ${vehicles}" class="vehicle-sheet">
        <!-- Header Corporativo -->
        <table class="header-table">
            <tr>
                <td class="header-title">
                    <h1 th:text="${vehicleData.vehicle['brand'] + ' ' + vehicleData.vehicle['model']}">FORD RANGER RAPTOR</h1>
                    <div class="subtitle" th:text="${vehicleData.vehicle['trim'] + (vehicleData.vehicle['year'] != '' ? ' • ' + vehicleData.vehicle['year'] : '')}">3.0 V6 Bi-Turbo • 2025</div>
                </td>
                <td class="header-meta">
                    <div>Emissão: <span th:text="${#temporals.format(generatedAt, 'dd/MM/yyyy HH:mm')}">29/08/2026 11:30</span></div>
                </td>
            </tr>
        </table>

        <!-- Cards de Destaque Técnico (Quick Specs) -->
        <table class="quick-specs-table" th:if="${vehicleData.highlights != null and not vehicleData.highlights.isEmpty()}">
            <tr>
                <!-- Acesso por colchetes, não por ponto: `highlights.motor` em
                     SpringEL estoura quando a chave não existe no Map, e
                     `extractHighlights` só preenche o que a pesquisa encontrou.
                     `highlights['motor']` devolve null e o th:if some com o card. -->
                <td class="quick-spec-card" th:if="${vehicleData.highlights['motor'] != null}">
                    <div class="quick-spec-label">Motor</div>
                    <div class="quick-spec-value" th:text="${vehicleData.highlights['motor']}">3.0 V6 Bi-Turbo</div>
                </td>
                <td class="quick-spec-card" th:if="${vehicleData.highlights['potencia'] != null}">
                    <div class="quick-spec-label">Potência</div>
                    <div class="quick-spec-value" th:text="${vehicleData.highlights['potencia']}">397 cv</div>
                </td>
                <td class="quick-spec-card" th:if="${vehicleData.highlights['torque'] != null}">
                    <div class="quick-spec-label">Torque</div>
                    <div class="quick-spec-value" th:text="${vehicleData.highlights['torque']}">59.4 kgfm</div>
                </td>
                <td class="quick-spec-card" th:if="${vehicleData.highlights['transmissao'] != null}">
                    <div class="quick-spec-label">Câmbio</div>
                    <div class="quick-spec-value" th:text="${vehicleData.highlights['transmissao']}">Aut. 10 marchas</div>
                </td>
                <td class="quick-spec-card" th:if="${vehicleData.highlights['tracao'] != null}">
                    <div class="quick-spec-label">Tração</div>
                    <div class="quick-spec-value" th:text="${vehicleData.highlights['tracao']}">4WD Integral</div>
                </td>
            </tr>
        </table>

        <!-- Grid de Categorias em 2 Colunas -->
        <div class="categories-grid">
            <!-- Coluna Esquerda: Categorias com índice par -->
            <div class="category-col">
                <div class="category-block" th:each="cat, iter : ${vehicleData.categories}" th:if="${iter.index % 2 == 0}">
                    <div class="category-header" th:text="${cat.name}">MOTOR E TRANSMISSÃO</div>
                    <table class="spec-table">
                        <tbody>
                            <tr th:each="row : ${cat.specs}">
                                <td class="spec-label" th:text="${row.campo}">Cilindrada</td>
                                <td class="spec-value" th:text="${row.valor}">2.956 cm³</td>
                                <td class="spec-source">
                                    <span class="badge-source"
                                          th:classappend="${row.fonteClass}"
                                          th:text="${row.fonteLabel}">Oficial</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Coluna Direita: Categorias com índice ímpar -->
            <div class="category-col">
                <div class="category-block" th:each="cat, iter : ${vehicleData.categories}" th:if="${iter.index % 2 != 0}">
                    <div class="category-header" th:text="${cat.name}">RODAS</div>
                    <table class="spec-table">
                        <tbody>
                            <tr th:each="row : ${cat.specs}">
                                <td class="spec-label" th:text="${row.campo}">Aro (polegadas)</td>
                                <td class="spec-value" th:text="${row.valor}">17</td>
                                <td class="spec-source">
                                    <span class="badge-source"
                                          th:classappend="${row.fonteClass}"
                                          th:text="${row.fonteLabel}">Oficial</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
